name: Publicar editorial en X via Buffer
run-name: X @cineposta · ${{ inputs.slug }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Slug de la editorial publicada (o guía semanal)
        required: true
        type: string
      mode:
        description: Vista previa o publicación inmediata autorizada
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish-now
      request_id:
        description: Referencia opcional del orquestador para verificar este envío
        required: false
        type: string
      require_original_tweet:
        description: Exigir el tweet original guardado en el recibo semanal
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cineposta-buffer-x
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verificar el publicador
        run: node --test scripts/publish-buffer-editorial-x.test.mjs
      - name: Publicar o previsualizar
        env:
          EDITORIAL_SLUG: ${{ inputs.slug }}
          PUBLISH_MODE: ${{ inputs.mode }}
          REQUIRE_ORIGINAL_TWEET: ${{ inputs.require_original_tweet }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
        run: |
          if [ "$PUBLISH_MODE" = 'publish-now' ]; then
            if [ "$REQUIRE_ORIGINAL_TWEET" = 'true' ]; then
              node scripts/publish-buffer-editorial-x.mjs "$EDITORIAL_SLUG" --publish-now --require-original-tweet
            else
              node scripts/publish-buffer-editorial-x.mjs "$EDITORIAL_SLUG" --publish-now
            fi
          elif [ "$REQUIRE_ORIGINAL_TWEET" = 'true' ]; then
            node scripts/publish-buffer-editorial-x.mjs "$EDITORIAL_SLUG" --require-original-tweet
          else
            node scripts/publish-buffer-editorial-x.mjs "$EDITORIAL_SLUG"
          fi
      - name: Guardar comprobante de Buffer
        if: ${{ inputs.mode == 'publish-now' && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: buffer-editorial-receipt
          path: buffer-editorial-receipt.json
          if-no-files-found: error
      - name: Conservar resultado o error para reintentar sólo X
        if: ${{ inputs.mode == 'publish-now' && always() }}
        env:
          EDITORIAL_SLUG: ${{ inputs.slug }}
        run: |
          if [ -f buffer-editorial-receipt.json ]; then
            mkdir -p reports/buffer-editorial
            cp buffer-editorial-receipt.json "reports/buffer-editorial/$EDITORIAL_SLUG.json"
            git add -- "reports/buffer-editorial/$EDITORIAL_SLUG.json"
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(buffer): record editorial delivery $EDITORIAL_SLUG"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
