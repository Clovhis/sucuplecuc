name: Radar de Cine diario (10:00 AR)

on:
  schedule:
    # Argentina is UTC-3 throughout the year.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinema-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared with the other home publishers, so editions never race to write main.
    concurrency:
      group: publish-home-editions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # Successful validation triggers deploy.yml to expire old local notes.
      - name: Verificar notas propias y construir el sitio
        run: npm run validate:content -- --astro-check
