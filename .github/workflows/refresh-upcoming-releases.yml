name: Refresh upcoming releases

on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-generated-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated upcoming releases
        run: UPCOMING_RELEASES_STRICT=1 npm run update-upcoming-releases

      - name: Validate generated content and build
        run: npm run validate:content -- --astro-check

      - name: Commit refreshed upcoming releases to main
        run: |
          expected_file='src/data/upcomingReleases.generated.ts'
          unexpected_files=$(git diff --name-only | grep -v "^${expected_file}$" || true)
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected files changed by the refresh:"
            echo "$unexpected_files"
            exit 1
          fi

          if git diff --quiet -- "$expected_file"; then
            echo "No upcoming release changes to publish."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$expected_file"
          git commit -m 'chore: refresh upcoming releases'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

