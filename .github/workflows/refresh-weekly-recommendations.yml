name: Refresh weekly recommendations

on:
  schedule:
    # 09:30 Argentina (ART, UTC-3) every Sunday.
    - cron: '30 12 * * 0'
  workflow_dispatch:
    inputs:
      force_rotation:
        description: 'Forzar una selección distinta a la edición vigente'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: refresh-generated-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly recommendations
        env:
          WEEKLY_RECOMMENDATIONS_FORCE_ROTATION: ${{ inputs.force_rotation || false }}
        run: npm run refresh:weekly-recommendations

      - name: Test weekly recommendation selector
        run: npm run test:weekly-recommendations

      - name: Validate generated content and build
        run: npm run validate:content -- --astro-check

      - name: Commit refreshed recommendations to main
        run: |
          expected_file='src/data/weeklyRecommendations.generated.ts'
          unexpected_files=$(git diff --name-only | grep -v "^${expected_file}$" || true)
          if [ -n "$unexpected_files" ]; then
            echo "Unexpected files changed by the refresh:"
            echo "$unexpected_files"
            exit 1
          fi

          if git diff --quiet -- "$expected_file"; then
            echo "No weekly recommendation changes to publish."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$expected_file"
          git commit -m 'chore: refresh weekly recommendations'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

