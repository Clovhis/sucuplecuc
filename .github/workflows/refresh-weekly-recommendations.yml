name: 'Edicion semanal: recomendadas y trailers (domingo 01:00 AR)'

on:
  schedule:
    # Sunday 01:00 Argentina (UTC-3), after Saturday night.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-home-edition
  cancel-in-progress: false

jobs:
  recommendations:
    name: Generar recomendadas de la semana
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:weekly-recommendations
      - run: npm run refresh:weekly-recommendations
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-recommendations
          path: src/data/weeklyRecommendations.generated.ts
          if-no-files-found: error
          retention-days: 2

  trailers:
    name: Generar proximos estrenos y trailers argentinos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-upcoming-releases
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-trailers
          path: src/data/upcomingReleases.generated.ts
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Validar y publicar ambas secciones juntas
    needs: [recommendations, trailers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-home-editions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: weekly-recommendations
          path: src/data
      - uses: actions/download-artifact@v4
        with:
          name: weekly-trailers
          path: src/data
      - name: Verificar ediciones y construir el sitio
        run: npm run validate:content -- --astro-check
      - name: Publicar exclusivamente la edicion semanal
        run: node scripts/publish-home-edition.mjs src/data/weeklyRecommendations.generated.ts src/data/upcomingReleases.generated.ts
