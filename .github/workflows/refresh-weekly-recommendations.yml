name: Refresh weekly recommendations

on:
  schedule:
    # 09:30 Argentina (ART, UTC-3) every Sunday.
    - cron: '30 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-weekly-recommendations
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly recommendations
        run: npm run refresh:weekly-recommendations

      - name: Test weekly recommendation selector
        run: npm run test:weekly-recommendations

      - name: Validate generated recommendation data
        run: npm run check

      - name: Validate production build
        run: npm run build

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/refresh-weekly-recommendations
          delete-branch: true
          commit-message: 'chore: refresh weekly recommendations'
          title: 'chore: refresh weekly recommendations'
          body: |
            Automated Sunday refresh of `src/data/weeklyRecommendations.generated.ts`.
            The selector keeps only confirmed streaming titles with a recommended verdict and balances new and older films.
            Review the generated content, then merge to publish the new edition.
          add-paths: src/data/weeklyRecommendations.generated.ts
