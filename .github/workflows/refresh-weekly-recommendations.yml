name: 'Recomendadas semanales (domingo 01:00 AR)'

on:
  schedule:
    # Sunday 01:00 Argentina (UTC-3), after Saturday night.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-home-edition
  cancel-in-progress: false

jobs:
  refresh:
    name: Generar y publicar recomendadas de la semana
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-home-editions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:weekly-recommendations
      - run: npm run refresh:weekly-recommendations
      - name: Verificar ediciones y construir el sitio
        run: npm run validate:content -- --astro-check
      - name: Publicar exclusivamente las recomendadas
        run: node scripts/publish-home-edition.mjs src/data/weeklyRecommendations.generated.ts
