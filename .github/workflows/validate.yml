name: 'Validar sitio: contenido, seguridad y navegadores'

on:
  pull_request:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full cross-browser Playwright suite
        required: false
        default: false
        type: boolean
      full_content_audit:
        description: Run the full catalog and profile audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure base branch ref
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch --track main origin/main
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verificar posters locales
        run: npm run posters:check

      - name: Probar automatizaciones y ediciones del home
        run: npm run test:home-automation

      - name: Probar migraciones de votos y tribunas en PostgreSQL local
        run: npm run test:movie-ratings

      - name: Probar trivia, identidades y puntajes en PostgreSQL local
        run: npm run test:trivia

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate people image policy
        run: npm run images:people:check

      - name: Validate content and build
        env:
          RUN_FULL_CONTENT_AUDIT: ${{ github.event_name == 'workflow_dispatch' && inputs.full_content_audit == true }}
        run: |
          if [ "$RUN_FULL_CONTENT_AUDIT" = "true" ]; then
            npm run validate:content -- --all --astro-check
          else
            npm run validate:content -- --astro-check
          fi

  e2e-chromium:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Run Chromium end-to-end tests
        run: npx playwright test --project=desktop-chromium

  e2e-cross-browser:
    # Chromium already runs above. Give each remaining project its own runner:
    # the former sequential five-browser job exceeded its 30-minute limit.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_e2e == 'true'
    needs: validate
    runs-on: ubuntu-latest
    name: E2E (${{ matrix.project }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-firefox
            browser: firefox
          - project: desktop-webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install project browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build site
        run: npm run build

      - name: Run project end-to-end suite
        run: npx playwright test --project=${{ matrix.project }}

      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3

