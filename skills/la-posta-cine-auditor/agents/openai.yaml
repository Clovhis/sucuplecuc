interface:
  display_name: "La Posta Cine Auditor"
  short_description: "Audita peliculas cargadas recientemente"
  default_prompt: "Audita las peliculas recien agregadas en La Posta Cine en modo silencioso: no mandes updates de progreso salvo bloqueo o fallo; detecta problemas de trailer, review, premios, plataforma, schema y bloques editoriales de recomendaciones, corrige solo los casos seguros y reporta todo junto al final. Trata cualquier review plantillada, reciclada, intercambiable o con cadencia robotizada como error duro y obliga a reescritura manual desde cero."
